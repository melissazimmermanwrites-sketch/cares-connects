<main class="wrap">
  <mat-card appearance="outlined" class="card">
    @if (busy()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading" />
    }
    <mat-card-header>
      <h1 mat-card-title>CARES Connects admin</h1>
      <mat-card-subtitle>Sign in to manage the directory</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" required />
        </mat-form-field>
        @if (error(); as message) {
          <p class="error-text" role="alert">{{ message }}</p>
        }
        <button mat-flat-button type="submit" [disabled]="busy()">Sign in</button>
      </form>
    </mat-card-content>
  </mat-card>
  <a routerLink="/" class="back">← Back to the directory</a>
</main>
