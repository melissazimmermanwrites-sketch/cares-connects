# Netlify: static files from the CDN, everything else (pages + /api) through one function that
# runs the Express server. Netlify builds the Develop branch from GitHub, with the site's base
# directory set to cares-connects/ (so this file is read). A local build also works:
#   npm run build && netlify deploy --prod --no-build
# Don't add Netlify's Angular plugin: it replaces server.ts with a version that can't run the API.
[build]
  # NODE_ENV=production makes npm skip devDependencies, which include the Angular build tools.
  command = "npm ci --include=dev && npm run build"
  publish = "dist/cares-connects/browser"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["dist/cares-connects/server/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
